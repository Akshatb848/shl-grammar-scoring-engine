name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint + repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements-ci.txt
      - name: Lint (syntax errors and undefined names, scripts + notebook)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Tests
        run: pytest -q
